[package]
name = "animelib-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
egui_extras = { version = "0.27", features = ["image"] }
reqwest = { version = "0.12", features = ["json", "cookies", "blocking"] }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
open = "5.1"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
base64 = "0.22.1"
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "animelib-desktop"
path = "src/main.rs"
